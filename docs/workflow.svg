<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <rect width="1200" height="500" fill="#fffdf8"/>
  <text x="60" y="62" font-family="Arial" font-size="30" font-weight="700" fill="#064a56">End-to-End Assessment Workflow</text>
  <g font-family="Arial" font-size="17" fill="#12343b">
    <rect x="70" y="130" width="230" height="100" rx="12" fill="#d9eef0" stroke="#064a56" stroke-width="2"/><text x="185" y="170" text-anchor="middle" font-weight="700">1. Inspect data</text><text x="185" y="200" text-anchor="middle">Schemas and quality</text>
    <rect x="350" y="130" width="230" height="100" rx="12" fill="#e7f2e7" stroke="#39734a" stroke-width="2"/><text x="465" y="170" text-anchor="middle" font-weight="700">2. Time validation</text><text x="465" y="200" text-anchor="middle">Avoid future leakage</text>
    <rect x="630" y="130" width="230" height="100" rx="12" fill="#fff0d5" stroke="#ad6b00" stroke-width="2"/><text x="745" y="170" text-anchor="middle" font-weight="700">3. Compare models</text><text x="745" y="200" text-anchor="middle">MAE and RMSE</text>
    <rect x="910" y="130" width="230" height="100" rx="12" fill="#f5e3ed" stroke="#8d315d" stroke-width="2"/><text x="1025" y="170" text-anchor="middle" font-weight="700">4. Select model</text><text x="1025" y="200" text-anchor="middle">Robustness and fit</text>
    <rect x="210" y="330" width="230" height="100" rx="12" fill="#e8e3f5" stroke="#5b4a8b" stroke-width="2"/><text x="325" y="370" text-anchor="middle" font-weight="700">5. Train final</text><text x="325" y="400" text-anchor="middle">All labeled data</text>
    <rect x="490" y="330" width="230" height="100" rx="12" fill="#d9eef0" stroke="#064a56" stroke-width="2"/><text x="605" y="370" text-anchor="middle" font-weight="700">6. Generate files</text><text x="605" y="400" text-anchor="middle">Validation and December</text>
    <rect x="770" y="330" width="230" height="100" rx="12" fill="#e7f2e7" stroke="#39734a" stroke-width="2"/><text x="885" y="370" text-anchor="middle" font-weight="700">7. Run scorer</text><text x="885" y="400" text-anchor="middle">Chart and checks</text>
  </g>
  <g stroke="#064a56" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M300 180 H350"/><path d="M580 180 H630"/><path d="M860 180 H910"/><path d="M1025 230 V280 H325 V330"/><path d="M440 380 H490"/><path d="M720 380 H770"/></g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#064a56"/></marker></defs>
</svg>